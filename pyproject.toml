[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "A minimal PDF RAG CLI with page-level source citations"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68,<3",
    "pypdf>=5,<7",
    "numpy>=1.26.4,<2",
    "transformers>=4.57.6,<5",
    "sentence-transformers>=3.4.1,<3.5",
    "torch>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
rag = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["rag_assistant*"]
